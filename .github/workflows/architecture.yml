name: architecture

on:
  pull_request:
    paths:
      - architecture/model/**
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - architecture/model/**

permissions:
  contents: read

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run arch:validate
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run arch:export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-views
          path: out/architecture/
